[build-system]
requires = ["hatchling", "hatch-vcs", "maturin>=1.15,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "src", "tests", "rust", "hatch_build.py", "README.md", "LICENSE",
    "scripts/benchmark_imzml.py", "scripts/audit_native_wheel.py", "benchmarks",
]
exclude = ["rust/target", "src/imzy/_imzml_rust*.so", "src/imzy/_imzml_rust*.pyd"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "imzy._imzml_rust"

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "uv"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
environment = { IMZY_BUILD_RUST = "1" }
test-extras = ["test"]
# Dependency installation runs from the project root on every platform.
test-environment = { UV_CONFIG_FILE = "tests/uv-wheel.toml" }
test-command = "python -m pytest {project}/tests/test_imzml_native.py {project}/tests/test_imzml.py {project}/tests/test_imzml_writer.py"
audit-requires = ["abi3audit"]
audit-command = 'python "{project}/scripts/audit_native_wheel.py" "{wheel}"'

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH", IMZY_BUILD_RUST = "1", IMZY_REQUIRE_RUST = "1" }

[tool.cibuildwheel.macos]
environment = { IMZY_BUILD_RUST = "1", IMZY_REQUIRE_RUST = "1" }

[tool.cibuildwheel.windows]
environment = { IMZY_BUILD_RUST = "1", IMZY_REQUIRE_RUST = "1" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
inherit.environment = "append"
# Rust's standard library requires macOS 10.12 on Intel, above CPython 3.10's default.
environment.MACOSX_DEPLOYMENT_TARGET = "10.12"
# Maturin honors cibuildwheel's platform override when naming the wheel.
environment._PYTHON_HOST_PLATFORM = "macosx-10.12-x86_64"

# https://peps.python.org/pep-0621/
[project]
name = "imzy"
description = "imzy: A new reader interface to imzML and other imaging mass spectrometry formats."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD 3-Clause License" }
authors = [
    { email = "lukas.migas@yahoo.com", name = "Lukasz G. Migas" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Utilities",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Operating System :: MacOS",
]
dynamic = ["version"]
dependencies = [
  "click",
  "numpy",
  "scipy",
  "numba",
  "tqdm",
  "natsort",
  "pluggy",
  "koyo>=0.3.5",
  "ims-utils>=0.1.8",
  "yoki5",
]

[project.scripts]
imzy = "imzy.cli:main"

# extras
# https://peps.python.org/pep-0621/#dependencies-optional-dependencies
[project.optional-dependencies]
plot = ["matplotlib"]
zarr = [
    "zarr>3,<4; python_version >= '3.11'",
    "dask; python_version >= '3.11'",
]
hdf5 = ["yoki5", "h5py", "hdf5plugin"]
all = ["imzy[hdf5]", "imzy[zarr]", "imzy[plot]"]
test = [
    "imzy[all]",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]

[dependency-groups]
test = [
    "imzy[all]",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "markdown-changelog"
]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
  "ipython",
  "mypy",
  "pdbpp",
  "pre-commit",
  "rich",
  "ruff",
]


[project.urls]
homepage = "https://github.com/vandeplaslab/imzy"
repository = "https://github.com/vandeplaslab/imzy"


# https://github.com/charliermarsh/ruff
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

# https://beta.ruff.rs/docs/rules/
[tool.ruff.lint]
extend-select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D",    # pydocstyle
    "I",    # isort
    "U",    # pyupgrade
    # "S",    # bandit
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
]
# I do this to get numpy-style docstrings AND retain
# D417 (Missing argument descriptions in the docstring)
# otherwise, see:
# https://beta.ruff.rs/docs/faq/#does-ruff-support-numpy-or-google-style-docstrings
# https://github.com/charliermarsh/ruff/issues/2606
extend-ignore = [
  "B904", # Exception chaining ingore
  "D100", # Missing docstring in public module
  "D102", # Mising docstring in magic method
  "D105", # Mising docstring in magic method
  "D107", # Missing docstring in __init__
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D213", # Multi-line docstring summary should start at the second line
  "D401", # First line should be in imperative mood
  "D413", # Missing blank line after last section
  "D416", # Section name should end with a colon
  "B019", # Allow usage or lru_cache
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]

# https://docs.pytest.org/en/6.2.x/customize.html
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "--maxfail 5 --durations=10 -rXxs"

# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
files = "src/**/*.py"
strict = true
disallow_any_generics = false
disallow_subclassing_any = false
show_error_codes = true
pretty = true
ignore_missing_imports = true
exclude = [
    "venv",
    "tests",
    "src/imzy/_version.py"
]

# module specific overrides
# [[tool.mypy.overrides]]
# module = ["numpy.*",]
# ignore_errors = true


# https://coverage.readthedocs.io/en/6.4/config.html
[tool.coverage.run]
source = ["src"]
relative_files = true
omit = [
  "tests/*",
  "*/__init__.py",
  "raise NotImplementedError",
  "def __repr__",
  "if __name__ == .__main__.:",
  "def test",
]

[tool.coverage.paths]
source = [
  "src",
  "/home/runner/work/imzy/imzy/src",
  "/Users/runner/work/imzy/imzy/src",
  "D:/a/imzy/imzy/src",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
    "\\.\\.\\.",
    "raise NotImplementedError()",
]


# https://github.com/mgedmin/check-manifest#configuration
[tool.check-manifest]
ignore = [
  ".github_changelog_generator",
  ".pre-commit-config.yaml",
  ".ruff_cache/**/*",
  "setup.py",
  "tests/**/*",
  "**/*_version.py",
  "Makefile",
  "MANIFEST.in",
  "uv.lock",
  "scripts/build_package.sh",
  "scripts/importtime.sh",
  "scripts/dump_obo_files.py",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
  ".idea/**/*",
  "examples/**/*",
]
ignore-bad-ideas = [
    "src/imzy/**/*.so",
]
