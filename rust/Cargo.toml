[package]
name = "imzy-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "_imzml_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310"] }
numpy = "0.30"
memmap2 = "0.9"
rayon = "1.10"

[profile.release]
opt-level = 3

